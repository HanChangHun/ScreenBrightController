[package]
name = "screen-bright-controller"
version = "0.5.2"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[workspace]
members = ["app/src-tauri"]
default-members = ["."]

[profile.release]
opt-level = "s"
strip = true
