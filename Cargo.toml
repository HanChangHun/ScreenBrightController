[package]
name = "screen-bright-controller"
version = "0.6.2"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_ColorSystem"] }

[workspace]
members = ["app/src-tauri"]
default-members = ["."]

[profile.release]
opt-level = "s"
strip = true
