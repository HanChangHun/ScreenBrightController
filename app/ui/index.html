<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Bright Controller</title><link rel="stylesheet" href="style.css"><script src="demo.js" defer></script><script src="app.js" defer></script></head><body data-surface="main"><main>
<header class="titlebar"><div><span class="eyebrow">DISPLAY / OPERATE</span><h1>Screen Bright Controller</h1></div><span class="version">v0.5</span><button id="settings-toggle" class="settings-gear" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">⚙</button><button id="restore" class="reset" aria-label="Restore original" title="Restore original">↺</button></header>
<section id="settings" class="settings-panel" aria-label="Settings" hidden><label class="enable"><input id="autostart" type="checkbox" disabled>Start with Windows</label><p>Launch in tray · no dimming applied at login.</p><div id="startup-message" role="status" aria-live="polite"></div></section>
<section class="operate" aria-label="Display dimming controls"><div class="section-heading"><h2>Dimming amount</h2><span>0–90 / integer</span></div><div id="monitors" class="display-list"></div></section>
<div id="notice" role="alert" class="notice" hidden></div>
</main></body></html>
