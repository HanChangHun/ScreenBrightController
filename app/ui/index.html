<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Bright Controller</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><script src="popup-geometry.js" defer></script></head><body data-surface="popup">
<div class="resize-edge" data-resize="North" aria-hidden="true"></div><div class="resize-edge" data-resize="East" aria-hidden="true"></div><div class="resize-edge" data-resize="South" aria-hidden="true"></div><div class="resize-edge" data-resize="West" aria-hidden="true"></div>
<div class="resize-corner" data-resize="NorthEast" aria-hidden="true"></div><div class="resize-corner" data-resize="SouthEast" aria-hidden="true"></div><div class="resize-corner" data-resize="SouthWest" aria-hidden="true"></div><div class="resize-corner" data-resize="NorthWest" aria-hidden="true"></div><main>
<header class="titlebar"><strong>Screen Bright Controller</strong><button id="settings-toggle" class="settings-gear" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">⚙</button><button id="close-popup" aria-label="Hide popup" title="Hide popup">−</button><button id="restore" class="reset" aria-label="Restore original" title="Restore original">↺</button></header>
<section id="settings" class="settings-panel" aria-label="Settings" hidden><label class="enable"><input id="autostart" type="checkbox" disabled>Start with Windows</label><p>Launch in tray · no dimming applied at login.</p><div id="startup-message" role="status" aria-live="polite"></div></section>
<section class="operate" aria-label="Display dimming controls"><div id="monitors" class="display-list"></div></section>
<section id="notice" role="alert" class="notice" hidden><div class="notice-copy"><p id="notice-message"></p><details id="notice-details"><summary>Details</summary><pre id="notice-detail"></pre></details></div><button id="recover" type="button" hidden>Restore</button><button id="reset-baseline" type="button" hidden>Reset to default ramp</button></section>
</main></body></html>
